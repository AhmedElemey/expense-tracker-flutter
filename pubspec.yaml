name: expensetracker
description: "ExpenseTracker — local expense tracking with categories and charts."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_riverpod: ^2.6.1
  fl_chart: ^1.0.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
  build_runner: ^2.4.13
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: assets/icon/icon.png
  # If separate adaptive layers are provided, point these at:
  #   assets/icon/adaptive_foreground.png
  #   assets/icon/adaptive_background.png
  # (or a color for the background).
